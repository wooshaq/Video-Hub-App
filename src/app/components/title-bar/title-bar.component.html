<!-- WsQ: the title bar is merged with the toolbar; only the window buttons live here -->
<div
  class="title-bar wsq-title"
  [ngClass]="{ dark: settingsButtons().darkMode.toggled, mac: macVersion() }"
>
  <button class="windows-button minimizeButton" (click)="initiateMinimize.emit()" aria-label="Minimalizuj">
    <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
  </button>
  <button class="windows-button maximizeButton" (click)="initiateMaximize.emit()" aria-label="Maksymalizuj">
    <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1" /></svg>
  </button>
  <button class="windows-button closeButton" (click)="initiateClose.emit()" aria-label="Zamknij">
    <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
  </button>
</div>
