name: Build Windows (WsQ)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (empty = only build artifacts)'
        required: false
        default: ''
  push:
    branches:
      - wsq-tags
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ---- VHA Remote (phone / tablet UI), pinned commit of whyboris/Video-Hub-App-remote ----
      - name: Checkout Remote
        uses: actions/checkout@v4
        with:
          repository: whyboris/Video-Hub-App-remote
          ref: 558d89945e10fdbbffc2de0cfbe53709d1b676bb
          path: _remote_src

      - name: Build Remote
        shell: bash
        working-directory: _remote_src
        run: |
          git log -1 --format='Remote commit: %H'
          npm ci
          npm run build
          OUT=dist/remote
          if [ -d dist/remote/browser ]; then OUT=dist/remote/browser; fi
          cp -r $OUT/* ../remote/
          ls ../remote

      # ---- Video Hub App ----
      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build Angular + main
        run: npm run build:prod

      - name: Package (NSIS installer)
        run: npx electron-builder build --win --x64 --publish never

      - name: Collect
        shell: bash
        run: |
          ls -la release
          mkdir out
          cp release/*.exe out/
          cd out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoHubApp-WsQ-windows
          path: out/*

      - name: Publish release (tag = v + version from package.json)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v$(node -p "require('./package.json').version")"; fi
          echo "Release: $TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Video Hub App 3 WsQ $TAG" --notes-file RELEASE_NOTES_WSQ.md
          fi
